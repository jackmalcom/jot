# Local S3 service for host development or alongside compose.yaml.
services:
  s3:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: jot-local
      MINIO_ROOT_PASSWORD: jot-local-secret
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - jot-s3-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30
  s3-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-ec']
    command:
      - mc alias set local http://s3:9000 jot-local jot-local-secret; mc mb --ignore-existing local/jot-images
volumes:
  jot-s3-data:
